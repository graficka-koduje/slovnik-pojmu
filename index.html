<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slovník pojmů – reprodukční grafik</title>
<style>
:root{--c:#00a3e0;--m:#e5007d;--y:#ffd500;--k:#1d1d1b;--bg:#f6f7f9;--card:#fff;--tx:#1d1d1b;--mut:#5b6170;--ln:#e3e6eb}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:150px}
body{margin:0;font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--k);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:1.6rem;letter-spacing:.3px}
.cmyk{display:flex;height:6px}.cmyk i{flex:1}.cmyk i:nth-child(1){background:var(--c)}.cmyk i:nth-child(2){background:var(--m)}.cmyk i:nth-child(3){background:var(--y)}.cmyk i:nth-child(4){background:#555}
header p{margin:4px 0 0;color:#cfd3da;font-size:.95rem}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 12px 6px;border-bottom:1px solid var(--ln)}
.wrap{max-width:900px;margin:0 auto}
#q{width:100%;font-size:1.05rem;padding:11px 14px;border:2px solid #c9ced6;border-radius:12px;outline:none}
#q:focus{border-color:var(--c)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:thin}
.chips button{flex:none;border:1.5px solid #c9ced6;background:#fff;border-radius:999px;padding:5px 12px;font-size:.88rem;cursor:pointer;color:var(--tx)}
.chips button.on{background:var(--k);border-color:var(--k);color:#fff}
.abc{display:flex;gap:2px;padding-top:4px;overflow-x:auto;scrollbar-width:none}
.abc a{flex:none;min-width:26px;text-align:center;padding:2px 3px;border-radius:6px;text-decoration:none;color:var(--k);font-weight:700;font-size:.85rem}
.abc a:hover{background:#e7eaef}
.info{color:var(--mut);font-size:.9rem;margin:10px 12px 0}
main{padding:4px 12px 90px}
.letter{font-size:1.5rem;font-weight:800;margin:22px 4px 8px;color:var(--m)}
.card{display:flex;gap:14px;background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px;margin:0 0 12px;transition:box-shadow .3s}
.card.hl{box-shadow:0 0 0 4px var(--y)}
.pic{flex:none;width:132px;height:88px;background:#fafbfc;border:1px solid var(--ln);border-radius:12px;display:flex;align-items:center;justify-content:center}
.pic svg{width:120px;height:80px}
.card h2{margin:0 0 4px;font-size:1.2rem}
.card p{margin:0 0 8px}
.kde{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem}
.kde span{color:var(--mut)}
.kde a{text-decoration:none;color:var(--k);background:#eef6fb;border:1px solid #cfe7f5;border-radius:8px;padding:3px 8px}
.kde a b{color:var(--c)}
.kde a:hover{background:#dff0fa}
.none{text-align:center;color:var(--mut);padding:30px}
#up{position:fixed;right:14px;bottom:14px;width:48px;height:48px;border-radius:50%;border:none;background:var(--m);color:#fff;font-size:1.5rem;box-shadow:0 3px 10px rgba(0,0,0,.25);cursor:pointer;display:none}
footer{color:var(--mut);font-size:.85rem;text-align:center;padding:0 12px 30px}
@media (max-width:560px){.card{flex-direction:column;gap:10px}.pic{width:100%;height:110px}.pic svg{width:165px;height:110px}}
/* barvy obrázků */
.ln{fill:none;stroke:#333;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lt{fill:none;stroke:#333;stroke-width:1.2;stroke-linecap:round}
.ds{fill:none;stroke:#333;stroke-width:1.3;stroke-dasharray:3 3}
.c{fill:var(--c)}.m{fill:var(--m)}.y{fill:var(--y)}.k{fill:var(--k)}.r{fill:#e30613}.gr{fill:#2fa84f}.b{fill:#2463eb}
.w{fill:#fff;stroke:#333;stroke-width:1.5}.g{fill:#d4d7dc}.g2{fill:#9aa0a8}.pa{fill:#f3e6c4;stroke:#a88b4a;stroke-width:1.2}
.sc{stroke:var(--c)}.sm{stroke:var(--m)}.sy{stroke:#e0b000}.sr{stroke:#e30613}
.t{font:600 10px system-ui,sans-serif;fill:#333}.ts{font:600 8px system-ui,sans-serif;fill:#333}
.se{font-family:Georgia,"Times New Roman",serif}.sa{font-family:Arial,Helvetica,sans-serif}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Slovník pojmů</h1>
    <p>Reprodukční grafik · pojmy z lekcí k ústní zkoušce</p>
  </div>
</header>
<div class="cmyk"><i></i><i></i><i></i><i></i></div>

<div class="bar">
  <div class="wrap">
    <input id="q" type="search" placeholder="🔍 Hledej pojem…" autocomplete="off">
    <div class="chips" id="chips"></div>
    <div class="abc" id="abc"></div>
  </div>
</div>

<div class="wrap">
  <div class="info" id="info"></div>
  <main id="list"></main>
  <footer>Slovník se doplňuje s každou novou lekcí.<br>Klikni na téma u pojmu a otevře se ti lekce na místě, kde se pojem učí. Zpět se vrátíš šipkou zpět v prohlížeči.</footer>
</div>
<button id="up" aria-label="Nahoru">↑</button>

<script>
/* ===== LEKCE ===== */
const BASE = "https://graficka-koduje.github.io/ustni-zkouska/";
const T = {
 1:["tema-01-pismo-a-papir","Písmo a papír"],
 2:["tema-02-polygraficka-montaz-a-knihy","Montáž a knihy"],
 3:["tema-03-dtp-studio-a-knizni-vazba","DTP a vazby"],
 4:["tema-04-software-a-cena-tisku","Software a cena"],
 5:["tema-05-archova-montaz","Archová montáž"],
 6:["tema-06-predlohy-a-rastr","Předlohy a rastr"],
 7:["tema-07-polygrafie-a-dokoncovani","Polygrafie"],

 9:["tema-09-teorie-barevnosti","Barvy a tisk z plochy"],
 10:["tema-10-color-management","Správa barev"]
};

/* ===== POMOCNÉ KRESBY ===== */
function dotsAM(x0,y0,cols,rows,step,rmin,rmax,cls){let s="";for(let i=0;i<cols;i++)for(let j=0;j<rows;j++){const r=rmin+(rmax-rmin)*i/(cols-1);s+=`<circle cx="${x0+i*step}" cy="${y0+j*step}" r="${r.toFixed(1)}" class="${cls||'k'}"/>`;}return s;}
function dotsFM(x0,y0,w,h,n,cls){let s="",seed=7;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};for(let i=0;i<n;i++){const u=Math.sqrt(rnd());s+=`<circle cx="${(x0+u*w).toFixed(1)}" cy="${(y0+rnd()*h).toFixed(1)}" r="1.3" class="${cls||'k'}"/>`;}return s;}
function lines(x,y,w,n,gap,cls){let s="";for(let i=0;i<n;i++)s+=`<line x1="${x}" y1="${y+i*gap}" x2="${x+w}" y2="${y+i*gap}" class="${cls||'lt'}"/>`;return s;}
function page(x,y,w,h,txt){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" class="w"/>`+(txt?`<text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" class="t">${txt}</text>`:"");}
function monitor(x,y,inner){return `<rect x="${x}" y="${y}" width="50" height="34" rx="3" class="w"/><rect x="${x+4}" y="${y+4}" width="42" height="26" class="g"/>${inner||""}<line x1="${x+25}" y1="${y+34}" x2="${x+25}" y2="${y+42}" class="ln"/><line x1="${x+15}" y1="${y+42}" x2="${x+35}" y2="${y+42}" class="ln"/>`;}
function book(x,y,w,h,cls){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="2" class="${cls||'c'}"/><rect x="${x}" y="${y}" width="7" height="${h}" class="k" opacity=".35"/>`;}

/* ===== POJMY =====
   id = adresa pojmu (…/slovnik-pojmu/#id)
   k  = kde se pojem učí: [číslo tématu, začátek nadpisu v lekci]
*/
const P = [
/* --- Téma 1 --- */
{id:"pismova-osnova",t:"Písmová osnova",e:"Pomyslné vodorovné linky, na kterých stojí písmena v řádku. Patří k nim účaří, střední výška a horní a dolní dotažnice.",k:[[1,"Písmová osnova"]],

{id:"ucari",t:"Účaří",e:"Linka, na které stojí písmena. Spodní výběžky písmen g, p, y sahají pod ni.",k:[[1,"Názvy částí osnovy"]],
 i:`<text x="14" y="54" font-size="44" class="se k">agy</text><line x1="6" y1="54" x2="114" y2="54" style="stroke:#e5007d;stroke-width:3"/><text x="88" y="70" class="t">účaří</text>`},
{id:"verzalka",t:"Verzálka a minuska",e:"Verzálka (majuskule) je velké písmeno. Minuska (minuskule) je malé písmeno.",k:[[1,"Názvy částí osnovy"]],
 i:`<text x="14" y="60" font-size="54" class="se k">A</text><text x="70" y="60" font-size="54" class="se m">a</text><line x1="6" y1="60" x2="114" y2="60" class="lt"/><text x="12" y="75" class="ts">verzálka</text><text x="70" y="75" class="ts">minuska</text>`},
{id:"kapitalka",t:"Kapitálka",e:"Písmeno, které má tvar velkého písmene, ale je vysoké jen jako malé písmeno.",k:[[1,"Jak poznat kapitálku od verzálky"]],
 i:`<line x1="6" y1="38" x2="114" y2="38" class="lt sm"/><text x="8" y="62" font-size="46" class="se k">A</text><text x="48" y="62" font-size="32" class="se m">A</text><text x="82" y="62" font-size="46" class="se k">a</text><line x1="6" y1="62" x2="114" y2="62" class="lt"/><text x="44" y="76" class="ts">kapitálka</text>`},
{id:"serif",t:"Serif (patka)",e:"Malé příčné zakončení tahu písmene. Písmo s patkami se dobře čte v delším textu, například v knize.",k:[[1,"Serif, patka a hlava"]],
 i:`<rect x="52" y="14" width="16" height="52" class="k"/><rect x="38" y="62" width="44" height="7" class="m"/><rect x="38" y="11" width="44" height="7" class="m"/><text x="88" y="70" class="t">patka</text>`},
{id:"antikva",t:"Antikva",e:"Písmo s patkami a se stínováním: tahy jsou různě silné. Používá se hlavně v knihách.",k:[[1,"Antikva × grotesk"],[1,"Druhy písma podle tvaru"]],

{id:"grotesk",t:"Grotesk",e:"Písmo bez patek. Tahy jsou stejně silné. Používá se na plakáty, obrazovky a navigační cedule.",k:[[1,"Antikva × grotesk"],[1,"Druhy písma podle tvaru"]],
 i:`<text x="60" y="58" text-anchor="middle" font-size="50" class="sa k">Aa</text><text x="60" y="74" text-anchor="middle" class="ts">bez patek</text>`},
{id:"druh-pisma",t:"Druh písma",e:"Konkrétní písmo s vlastním jménem a vlastní kresbou, například Garamond nebo Helvetica.",k:[[1,"Druh písma"],[1,"Jak to nesplést"]],
 i:`<text x="60" y="34" text-anchor="middle" font-size="20" class="se k">Garamond</text><text x="60" y="64" text-anchor="middle" font-size="20" class="sa k" font-weight="700">Helvetica</text>`},
{id:"rez-pisma",t:"Řez písma",e:"Varianta jednoho druhu písma, například obyčejné písmo, kurzíva nebo tučné písmo.",k:[[1,"Řez písma"],[1,"Jak to nesplést"]],
 i:`<text x="20" y="54" font-size="42" class="se k">a</text><text x="50" y="54" font-size="42" class="se k" font-style="italic">a</text><text x="82" y="54" font-size="42" class="se k" font-weight="700">a</text><text x="26" y="66" text-anchor="middle" class="ts">obyčejné</text><text x="60" y="76" text-anchor="middle" class="ts">kurzíva</text><text x="94" y="66" text-anchor="middle" class="ts">tučné</text>`},
{id:"pismova-rodina",t:"Písmová rodina",e:"Jeden druh písma ve všech řezech a velikostech dohromady.",k:[[1,"Písmová rodina"],[1,"Jak to nesplést"]],
 i:`<rect x="22" y="8" width="76" height="64" rx="6" class="w"/><text x="34" y="24" font-size="13" class="se k">Garamond</text><text x="34" y="39" font-size="13" class="se k" font-style="italic">Garamond</text><text x="34" y="54" font-size="13" class="se k" font-weight="700">Garamond</text><text x="34" y="68" font-size="13" class="se k" font-weight="700" font-style="italic">Garamond</text>`},
{id:"typograficky-bod",t:"Typografický bod a cicero",e:"Evropská měrná soustava pro písmo (Didotův systém). 1 typografický bod = 0,376 mm. 12 bodů = 1 cicero.",k:[[1,"Didotův měrný systém"]],
 i:`<rect x="8" y="30" width="104" height="22" class="pa"/>${Array.from({length:13},(_,n)=>`<line x1="${12+n*8}" y1="30" x2="${12+n*8}" y2="${n%12==0?50:40}" class="lt"/>`).join("")}<text x="60" y="68" text-anchor="middle" class="t">12 bodů = 1 cicero</text>`},
{id:"point-pica",t:"Point a pica",e:"Angloamerická měrná soustava. Používají ji programy jako InDesign. 1 point (pt) = 0,353 mm. 12 pointů = 1 pica.",k:[[1,"Měrný systém pica"],[1,"Cicero a pica vedle sebe"]],
 i:`<rect x="8" y="30" width="104" height="22" class="pa" style="fill:#dff0fa;stroke:#00a3e0"/>${Array.from({length:13},(_,n)=>`<line x1="${12+n*8}" y1="30" x2="${12+n*8}" y2="${n%12==0?50:40}" class="lt"/>`).join("")}<text x="60" y="68" text-anchor="middle" class="t">12 pt = 1 pica</text>`},
{id:"ctvercik",t:"Čtverčík",e:"Čtverec, jehož strana je stejně velká jako velikost písma. Písmo 10 bodů má čtverčík 10 × 10 bodů. Používá se na odsazení.",k:[[1,"Výpočty z písemky"]],
 i:`<rect x="38" y="12" width="44" height="44" class="w" style="stroke:#e5007d;stroke-width:2.5"/><text x="60" y="49" text-anchor="middle" font-size="38" class="se k">M</text><text x="60" y="72" text-anchor="middle" class="t">10 b × 10 b</text>`},
{id:"odstavcova-zarazka",t:"Odstavcová zarážka",e:"Odsazení prvního řádku odstavce. Obvykle je velká jeden čtverčík.",k:[[1,"Výpočty z písemky"]],
 i:`<rect x="16" y="16" width="12" height="12" class="m" opacity=".5"/><line x1="30" y1="22" x2="104" y2="22" class="ln"/>${lines(16,34,88,4,10,'ln')}`},
{id:"proklad",t:"Meziřádkový proklad",e:"Vzdálenost od účaří jednoho řádku k účaří dalšího řádku. Obvykle je to velikost písma × 1,2. Zápis 10/12 znamená písmo 10 bodů a proklad 12 bodů.",k:[[1,"Výpočty z písemky"],[4,"Zalomení odstavce, písmo a proklad"]],
 i:`<text x="10" y="32" font-size="20" class="se k">Řádek</text><text x="10" y="62" font-size="20" class="se k">Řádek</text><line x1="8" y1="32" x2="80" y2="32" class="lt sm"/><line x1="8" y1="62" x2="80" y2="62" class="lt sm"/><line x1="92" y1="32" x2="92" y2="62" class="ln sm"/><path d="M88 37l4-5 4 5M88 57l4 5 4-5" class="ln sm"/><text x="98" y="51" class="t">12</text>`},
{id:"papyrus",t:"Papyrus",e:"Psací materiál ze starého Egypta. Vyráběl se z rostliny šáchor papírodárný. Psalo se jen na jednu stranu a listy se lepily do svitků.",k:[[1,"Jak se vyráběl papyrus"],[1,"Srovnání: papyrus, pergamen, papír"]],
 i:`<rect x="22" y="20" width="76" height="40" class="pa"/><rect x="12" y="16" width="12" height="48" rx="6" class="pa"/><rect x="96" y="16" width="12" height="48" rx="6" class="pa"/>${lines(32,30,56,3,10,'lt')}`},

{id:"papir",t:"Papír",e:"Tenká vrstva rostlinných vláken, která jsou spojená, slisovaná a usušená.",k:[[1,"Ruční výroba papíru krok za krokem"],[1,"Srovnání: papyrus, pergamen, papír"]],

{id:"drevovina-bunicina",t:"Dřevovina × buničina",e:"Dřevovina je dřevo rozemleté s vodou. Je levná, ale papír z ní na světle žloutne. Buničina (celulóza) vzniká vařením dřeva s chemikáliemi. Papír z ní je bílý a vydrží dlouho.",k:[[1,"Ze dřeva na papír"]],

 i:`<rect x="28" y="6" width="64" height="8" class="g2"/><line x1="60" y1="14" x2="60" y2="34" style="stroke:#333;stroke-width:4"/><rect x="38" y="34" width="44" height="8" class="g2"/><rect x="32" y="52" width="56" height="10" class="k"/><rect x="20" y="62" width="80" height="6" class="g2"/><line x1="24" y1="6" x2="24" y2="68" class="ln"/><line x1="96" y1="6" x2="96" y2="68" class="ln"/><text x="60" y="78" text-anchor="middle" class="ts">kolem roku 1450</text>`},

/* ===== ZOBRAZENÍ ===== */
const col = new Intl.Collator("cs",{sensitivity:"base"});
P.sort((a,b)=>col.compare(a.s||a.t,b.s||b.t));
const norm = s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const firstLetter = t=>{const u=t.toUpperCase();if(u.startsWith("CH"))return "Ch";const c=u[0];const m={"Á":"A","É":"E","Ě":"E","Í":"I","Ó":"O","Ú":"U","Ů":"U","Ý":"Y","Ď":"D","Ť":"T","Ň":"N"};return m[c]||c;};
const fragEnc = s=>encodeURIComponent(s).replace(/-/g,"%2D");
const link = ([n,h])=>`${BASE}${T[n][0]}/#:~:text=${fragEnc(h)}`;

let topic = 0, query = "";
const list = document.getElementById("list"), info = document.getElementById("info");

function chips(){
  const el=document.getElementById("chips");
  const b=[[0,"Vše"],...Object.keys(T).map(n=>[+n,`${n} · ${T[n][1]}`])];
  el.innerHTML=b.map(([n,l])=>`<button data-t="${n}" class="${n===topic?'on':''}">${l}</button>`).join("");
  el.onclick=e=>{const t=e.target.closest("button");if(!t)return;topic=+t.dataset.t;chips();render();};
}

function render(){
  const q=norm(query.trim());
  const items=P.filter(p=>(!topic||p.k.some(k=>k[0]===topic))&&(!q||norm(p.t+" "+p.e).includes(q)));
  let html="",last="";const letters=[];
  for(const p of items){
    const L=firstLetter(p.s||p.t);
    if(L!==last){html+=`<div class="letter" id="pismeno-${L}">${L}</div>`;letters.push(L);last=L;}
    const kde=[...p.k].sort((a,b)=>a[0]-b[0]).map(k=>`<a href="${link(k)}"><b>Téma ${k[0]}</b> · ${k[1]}</a>`).join("");
    html+=`<article class="card" id="${p.id}"><div class="pic"><svg viewBox="0 0 120 80" role="img" aria-label="${p.t}">${p.i}</svg></div><div><h2>${p.t}</h2><p>${p.e}</p><div class="kde"><span>Kde se to učí:</span>${kde}</div></div></article>`;
  }
  list.innerHTML=html||`<div class="none">Nic jsem nenašel. Zkus jiné slovo.</div>`;
  document.getElementById("abc").innerHTML=letters.map(L=>`<a href="#pismeno-${L}">${L}</a>`).join("");
  info.textContent=topic?`Téma ${topic} · ${T[topic][1]}: ${items.length} pojmů`:`Celkem ${items.length} pojmů z témat 1–10`;
}

function pad(){document.documentElement.style.scrollPaddingTop=(document.querySelector(".bar").offsetHeight+8)+"px";}
function openHash(){
  const id=decodeURIComponent(location.hash.slice(1));
  if(!id||id.startsWith("pismeno-"))return;
  if(!P.some(p=>p.id===id))return;
  topic=0;query="";document.getElementById("q").value="";chips();render();
  const el=document.getElementById(id);
  if(el){pad();el.scrollIntoView({block:"start",behavior:"instant"});el.classList.add("hl");setTimeout(()=>el.classList.remove("hl"),2500);}
}

document.getElementById("q").addEventListener("input",e=>{query=e.target.value;render();});
const up=document.getElementById("up");
window.addEventListener("scroll",()=>{up.style.display=scrollY>600?"block":"none";});
up.onclick=()=>scrollTo({top:0,behavior:"smooth"});
window.addEventListener("hashchange",openHash);
chips();render();pad();window.addEventListener("resize",pad);openHash();
</script>
